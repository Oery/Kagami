[package]
name = "kagami-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
# `tests/` holds unit tests included from `src` with `#[path]`, not integration tests.
autotests = false

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }

[lib]
proc-macro = true
path = "src/lib.rs"
